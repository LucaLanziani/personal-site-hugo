{{ define "main" }}
<div class="wrap">
    <header class="page-head">
        <p class="eyebrow">{{ .Data.Singular | humanize | title }}</p>
        <h1>{{ .Data.Term }}</h1>
        <p class="lede">{{ len .Pages }} article{{ if ne (len .Pages) 1 }}s{{ end }} filed under this {{ .Data.Singular }}.</p>
    </header>
    <div class="entry-list">
        {{ range .Pages }}
        {{ partial "entry.html" . }}
        {{ end }}
    </div>
</div>
{{ end }}
