<footer class="site-footer">
    <div class="wrap">
        <div class="site-footer__inner">
            <div class="site-footer__brand">
                <span class="site-footer__name">{{ .Site.Title }}</span>
                <p class="site-footer__tagline">{{ .Site.Params.description }}</p>
            </div>
            <div class="site-footer__cols">
                <div class="footer-col">
                    <h2>Site</h2>
                    <ul>
                        {{ range .Site.Menus.main }}
                        <li><a href="{{ .URL | relLangURL }}">{{ .Name }}</a></li>
                        {{ end }}
                    </ul>
                </div>
                <div class="footer-col">
                    <h2>Browse</h2>
                    <ul>
                        <li><a href="{{ "/posts/" | relURL }}">All articles</a></li>
                        <li><a href="{{ "/tags/" | relURL }}">Tags</a></li>
                        <li><a href="{{ "/archives/" | relURL }}">Archives</a></li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="site-footer__bottom">
            <span>&copy; {{ now.Format "2006" }} {{ .Site.Title }}</span>
            {{ partial "social.html" . }}
        </div>
    </div>
</footer>
