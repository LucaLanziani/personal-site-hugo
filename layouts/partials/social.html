    {{ with .Site.Params.twitter }}

        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm9 7.38 7.6-5.13H4.4L12 12.38ZM4 8.4V17h16V8.4l-7.44 5.02a1 1 0 0 1-1.12 0L4 8.4Z"/></svg>

        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 17a2 2 0 1 1 0 4 2 2 0 0 1 0-4ZM3 10.2v3a7.8 7.8 0 0 1 7.8 7.8h3A10.8 10.8 0 0 0 3 10.2Zm0-6v3A13.8 13.8 0 0 1 16.8 21h3A16.8 16.8 0 0 0 3 4.2Z"/></svg>
